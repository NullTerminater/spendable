# Spendable — xcodegen project definition.
# Edit this file, then run scripts/bootstrap.sh. Never edit the generated .pbxproj.
name: Spendable

options:
  bundleIdPrefix: com.nullterminater
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top
  xcodeVersion: "26.6"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: UW2KV7XB66
    CODE_SIGN_STYLE: Automatic
    # Team-ID-style app group ids are validated against the signing team, not the portal.
    REGISTER_APP_GROUPS: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    DEAD_CODE_STRIPPING: "YES"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: "YES"
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    exactVersion: 7.11.1

targets:
  Spendable:
    type: application
    platform: macOS
    sources:
      - path: Sources/Spendable
    dependencies:
      - package: GRDB
        product: GRDB
      - target: SpendableWidget
        embed: true
        codeSign: true
    entitlements:
      path: Sources/Spendable/Spendable.entitlements
      properties:
        com.apple.security.application-groups:
          - UW2KV7XB66.spendable
    info:
      path: Sources/Spendable/Info.plist
      properties:
        CFBundleDisplayName: Spendable
        CFBundleName: Spendable
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Private, single-user. Not for distribution.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nullterminater.spendable
        PRODUCT_NAME: Spendable
        ENABLE_APP_SANDBOX: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
    scheme:
      testTargets:
        - SpendableTests
      gatherCoverageData: false

  SpendableWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/SpendableWidget
    entitlements:
      path: Sources/SpendableWidget/SpendableWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - UW2KV7XB66.spendable
    info:
      path: Sources/SpendableWidget/Info.plist
      properties:
        CFBundleDisplayName: Spendable
        CFBundleName: SpendableWidget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nullterminater.spendable.widget
        PRODUCT_NAME: SpendableWidget
        ENABLE_APP_SANDBOX: "YES"
        ENABLE_HARDENED_RUNTIME: "NO"
        SKIP_INSTALL: "YES"

  SpendableTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SpendableTests
      - path: Tests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: Spendable
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nullterminater.spendable.tests
        GENERATE_INFOPLIST_FILE: "YES"
